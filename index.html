<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b11f4b" />
    <title>Drawback Chess — A little less ordinary</title>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        let saved;
        try {
          saved = localStorage.getItem("drawback-chess-theme");
        } catch (error) {
          console.error("Unable to load theme preference:", error);
        }
        const theme =
          (param === "light" || param === "dark" ? param : null) ||
          (saved === "light" || saved === "dark" ? saved : null) ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
